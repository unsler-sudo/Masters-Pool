<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" width="340" height="96" role="img" aria-label="DP World Tour" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>DP World Tour</title>
  <defs>
    <linearGradient id="dpwGlobe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a6091"/>
      <stop offset="100%" stop-color="#0b3b5c"/>
    </linearGradient>
  </defs>

  <!-- globe mark -->
  <g transform="translate(8,10)">
    <circle cx="38" cy="38" r="36" fill="url(#dpwGlobe)"/>
    <!-- meridians / parallels -->
    <g fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85" stroke-linecap="round">
      <line x1="2" y1="38" x2="74" y2="38"/>
      <path d="M38 2 C 20 20, 20 56, 38 74"/>
      <path d="M38 2 C 56 20, 56 56, 38 74"/>
      <path d="M9 18 C 24 27, 52 27, 67 18"/>
      <path d="M9 58 C 24 49, 52 49, 67 58"/>
    </g>
    <!-- ball dimple accent -->
    <circle cx="38" cy="38" r="36" fill="none" stroke="#d4a017" stroke-width="3"/>
  </g>

  <!-- wordmark -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#0b3b5c">
    <text x="98" y="46" font-size="30" font-weight="700" letter-spacing="1.5">DP WORLD</text>
    <text x="99" y="74" font-size="20" font-weight="400" letter-spacing="7.5" fill="#1a6091">TOUR</text>
  </g>
</svg>
